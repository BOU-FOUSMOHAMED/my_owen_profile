<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Redirection…</title>
    <script>
      /*
        GitHub Pages SPA fallback.
        GitHub Pages has no rewrite support, so unknown paths are served this
        file. It hands the original path back to the app, preserving the
        language prefix and the blog slug so deep links stay crawlable.
      */
      (function () {
        var SUPPORTED = ["fr", "en", "es", "ar", "tam"];
        var segments = window.location.pathname.split("/").filter(Boolean);

        // On a project Pages site the first segment is the repo name; drop it.
        var start = SUPPORTED.indexOf(segments[0]) === -1 ? 1 : 0;
        var rest = segments.slice(start);

        if (rest.length === 0 || SUPPORTED.indexOf(rest[0]) === -1) rest = ["fr"];
        if (rest.length === 1) rest.push("");

        window.location.replace("./" + rest.join("/") + window.location.search + window.location.hash);
      })();
    </script>
  </head>
  <body></body>
</html>
